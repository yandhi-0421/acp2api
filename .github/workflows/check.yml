name: Check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.96.0 build --workspace --locked
      - run: cargo +1.96.0 test --workspace --locked --no-fail-fast
      - name: Diagnose the acceptance exit (temporary, #98)
        if: failure()
        shell: bash
        timeout-minutes: 35
        run: |
          set +e
          cargo +1.96.0 test -p acp2api-acceptance --test acceptance --locked -- --concurrency 1 > acceptance.log 2>&1
          echo "cargo exit=$?"
          grep -aE "Caused by|exit code|overflowed|panicked" acceptance.log
          echo "--- last features and scenarios"
          grep -aE "^Feature:|^ *Scenario" acceptance.log | tail -n 4
          echo "--- log tail"
          tail -n 40 acceptance.log
      - run: cargo +1.96.0 fmt --all -- --check
      - run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
