name: Check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.96.0 build --workspace --locked
      - run: cargo +1.96.0 test --workspace --locked --no-fail-fast
      - name: Verify the native outbound connection controls
        run: cargo +1.96.0 test -p acp2api-acceptance --test network_observer_control --locked -- --ignored --test-threads=1
      - name: Verify native audit cleanup
        run: cargo +1.96.0 test -p acp2api-acceptance --lib --locked network_observer -- --ignored --test-threads=1
      - run: cargo +1.96.0 fmt --all -- --check
      - run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
