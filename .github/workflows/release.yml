name: Release archives

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: 5
      # Keep the Windows archive independent of a Visual C++ redistributable installation.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        timeout-minutes: 3
        with:
          python-version: '3.13'
      - name: Check the workspace version and tag
        timeout-minutes: 1
        run: python .github/release.py version
      - name: Install the check toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.96.0 --profile minimal --target ${{ matrix.target }}
      - name: Build the release executable
        timeout-minutes: 20
        run: cargo +1.96.0 build --release --locked -p acp2api --bin acp2api --target ${{ matrix.target }}
      - name: Make the archive
        timeout-minutes: 1
        run: python .github/release.py package ${{ matrix.target }}
      - name: Unpack and start the archive on its platform
        timeout-minutes: 2
        run: python .github/release.py start ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: archive-${{ matrix.target }}
          path: dist/acp2api-*
          if-no-files-found: error
          retention-days: 7

  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        timeout-minutes: 3
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v7
        timeout-minutes: 3
        with:
          python-version: '3.13'
      - name: Check the four archives and write SHA256SUMS
        timeout-minutes: 1
        run: python .github/release.py checksums
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        timeout-minutes: 3
        with:
          name: release-archives
          path: dist
      - uses: actions/setup-python@v7
        timeout-minutes: 3
        with:
          python-version: '3.13'
      - name: Create or update the draft release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/release.py draft
