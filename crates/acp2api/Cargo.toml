[package]
name = "acp2api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.23.1"
futures-util = "=0.3.34"
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
